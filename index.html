<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="app-header">
    <h1>Daf Yomi Tracker</h1>
    <nav id="tab-bar" role="tablist">
      <button class="tab active" data-mode="talmud" role="tab" aria-selected="true">Talmud Bavli</button>
      <button class="tab" data-mode="tanach" role="tab" aria-selected="false">Tanach</button>
    </nav>
    <div id="overall-stats"></div>
    <div class="progress-bar" id="overall-progress-bar">
      <div class="progress-fill" id="overall-progress-fill"></div>
    </div>
  </header>

  <main id="sedarim-container"></main>

  <footer id="app-footer">
    <button id="export-btn" class="footer-btn">Export</button>
    <button id="import-btn" class="footer-btn">Import</button>
    <input type="file" id="import-file" hidden accept=".json">
    <button id="reset-btn" class="footer-btn footer-btn-danger">Reset</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
